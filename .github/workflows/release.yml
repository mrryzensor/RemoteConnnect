name: Build & Release Windows & Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.10). Leave empty to only upload build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.1.12" }
          (Get-Content app/src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$tag`"" | Set-Content app/src-tauri/Cargo.toml
          (Get-Content app/src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$tag`"" | Set-Content app/src-tauri/tauri.conf.json

      - name: Build RemoteConnect Windows Portable & Installers (NSIS + MSI)
        working-directory: app
        run: npm run tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "app/src-tauri/target/release/remoteconnect-desktop.exe" "release-assets/RemoteConnect-Portable-x64.exe"
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/"
          Copy-Item "app/src-tauri/target/release/bundle/msi/*.msi" "release-assets/"
          Get-ChildItem release-assets

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Windows-x64
          path: release-assets/*

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable + Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^version = \".*\"/version = \"$TAG\"/" app/src-tauri/Cargo.toml
            sed -i "s/\"version\": \".*\"/\"version\": \"$TAG\"/" app/src-tauri/tauri.conf.json
          fi

      - name: Initialize & Build Android APK (Tauri 2)
        working-directory: app
        run: |
          export NDK_HOME="${ANDROID_HOME}/ndk/27.0.12077973"
          npx tauri android init --ci

          # Inject native Android in-app APK downloader & official PackageInstaller.Session bridge (window.AndroidUpdater)
          python3 - <<'PYEOF'
          from pathlib import Path
          manifest_path = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          txt = manifest_path.read_text(encoding="utf-8")
          if "REQUEST_INSTALL_PACKAGES" not in txt:
              txt = txt.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',
                  1,
              )
          manifest_path.write_text(txt, encoding="utf-8")

          main_act = next(Path("src-tauri/gen/android/app/src/main/java").rglob("MainActivity.kt"))
          pkg_line = main_act.read_text(encoding="utf-8").splitlines()[0]
          kotlin_code = f'''{pkg_line}

          import android.app.PendingIntent
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageInstaller
          import android.net.Uri
          import android.os.Build
          import android.provider.Settings
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import android.widget.Toast
          import androidx.activity.OnBackPressedCallback
          import java.io.File
          import java.io.FileInputStream
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : TauriActivity() {{
            private var activeWebView: WebView? = null
            private var downloadedApk: File? = null
            private var installReceiverRegistered = false
            private var lastBackPressMs = 0L

            private val installAction: String
              get() = applicationContext.packageName + ".INSTALL_UPDATE_RESULT"

            private val installReceiver = object : BroadcastReceiver() {{
              override fun onReceive(context: Context, intent: Intent) {{
                val status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE)
                when (status) {{
                  PackageInstaller.STATUS_PENDING_USER_ACTION -> {{
                    @Suppress("DEPRECATION")
                    val confirmIntent = intent.getParcelableExtra<Intent>(Intent.EXTRA_INTENT)
                    if (confirmIntent != null) {{
                      confirmIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      startActivity(confirmIntent)
                    }}
                  }}
                  PackageInstaller.STATUS_SUCCESS -> {{
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('Actualización instalada correctamente')")
                  }}
                  else -> {{
                    val msg = intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE) ?: "Error de instalación ($status)"
                    val safe = msg.replace("'", "")
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('$safe')")
                  }}
                }}
              }}
            }}

            override fun onWebViewCreate(webView: WebView) {{
              super.onWebViewCreate(webView)
              activeWebView = webView
              webView.addJavascriptInterface(AndroidUpdaterBridge(), "AndroidUpdater")
              if (!installReceiverRegistered) {{
                val filter = IntentFilter(installAction)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {{
                  registerReceiver(installReceiver, filter, Context.RECEIVER_NOT_EXPORTED)
                }} else {{
                  @Suppress("UnspecifiedRegisterReceiverFlag")
                  registerReceiver(installReceiver, filter)
                }}
                installReceiverRegistered = true
              }}
              onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {{
                override fun handleOnBackPressed() {{
                  val wv = activeWebView
                  if (wv == null) {{
                    isEnabled = false
                    onBackPressedDispatcher.onBackPressed()
                    return
                  }}
                  wv.evaluateJavascript("Boolean(window.__remoteConnectInViewer)") {{ res ->
                    if (res == "true") {{
                      val now = System.currentTimeMillis()
                      if (now - lastBackPressMs <= 1800L) {{
                        lastBackPressMs = 0L
                        wv.evaluateJavascript("window.__onAndroidDoubleBack && window.__onAndroidDoubleBack()", null)
                      }} else {{
                        lastBackPressMs = now
                        Toast.makeText(
                          this@MainActivity,
                          "Presiona atrás nuevamente para volver al panel",
                          Toast.LENGTH_SHORT
                        ).show()
                      }}
                    }} else {{
                      isEnabled = false
                      onBackPressedDispatcher.onBackPressed()
                      isEnabled = true
                    }}
                  }}
                }}
              }})
            }}

            override fun onDestroy() {{
              if (installReceiverRegistered) {{
                try {{ unregisterReceiver(installReceiver) }} catch (_: Exception) {{}}
                installReceiverRegistered = false
              }}
              super.onDestroy()
            }}

            inner class AndroidUpdaterBridge {{
              @JavascriptInterface
              fun downloadApk(urlStr: String) {{
                thread(start = true) {{
                  try {{
                    var currentUrl = urlStr
                    var conn: HttpURLConnection? = null
                    for (i in 0..5) {{
                      conn = (URL(currentUrl).openConnection() as HttpURLConnection).apply {{
                        instanceFollowRedirects = false
                        connectTimeout = 15000
                        readTimeout = 30000
                        setRequestProperty("User-Agent", "RemoteConnect-Android")
                      }}
                      val code = conn.responseCode
                      if (code in 300..399) {{
                        val loc = conn.getHeaderField("Location") ?: break
                        currentUrl = URL(URL(currentUrl), loc).toString()
                        conn.disconnect()
                      }} else {{
                        break
                      }}
                    }}
                    if (conn == null || conn.responseCode !in 200..299) {{
                      val status = conn?.responseCode ?: -1
                      evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('HTTP $status al descargar APK')")
                      return@thread
                    }}
                    val total = conn.contentLengthLong
                    val outFile = File(cacheDir, "RemoteConnect-update.apk")
                    conn.inputStream.use {{ input ->
                      FileOutputStream(outFile).use {{ output ->
                        val buf = ByteArray(16384)
                        var copied = 0L
                        var lastPct = -1
                        while (true) {{
                          val n = input.read(buf)
                          if (n <= 0) break
                          output.write(buf, 0, n)
                          copied += n
                          if (total > 0) {{
                            val pct = ((copied * 100) / total).toInt().coerceIn(0, 100)
                            if (pct != lastPct) {{
                              lastPct = pct
                              evalJs("window.__onAndroidUpdateProgress && window.__onAndroidUpdateProgress($pct)")
                            }}
                          }}
                        }}
                      }}
                    }}
                    conn.disconnect()
                    if (outFile.length() < 100_000) {{
                      evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('Descarga incompleta del APK')")
                      return@thread
                    }}
                    downloadedApk = outFile
                    evalJs("window.__onAndroidUpdateReady && window.__onAndroidUpdateReady()")
                  }} catch (e: Exception) {{
                    val safe = (e.message ?: "Error de red").replace("'", "")
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('$safe')")
                  }}
                }}
              }}

              @JavascriptInterface
              fun installApk() {{
                val file = downloadedApk ?: File(cacheDir, "RemoteConnect-update.apk")
                if (!file.exists() || file.length() < 100_000) {{
                  evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('Archivo APK no encontrado o incompleto')")
                  return
                }}
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !packageManager.canRequestPackageInstalls()) {{
                  runOnUiThread {{
                    val settingsIntent = Intent(
                      Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      Uri.parse("package:" + applicationContext.packageName)
                    ).apply {{
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    }}
                    startActivity(settingsIntent)
                  }}
                  evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('Activa Permitir desde esta fuente y vuelve a pulsar Instalar APK ahora')")
                  return
                }}
                thread(start = true) {{
                  try {{
                    val installer = packageManager.packageInstaller
                    val params = PackageInstaller.SessionParams(PackageInstaller.SessionParams.MODE_FULL_INSTALL)
                    params.setAppPackageName(applicationContext.packageName)
                    val sessionId = installer.createSession(params)
                    installer.openSession(sessionId).use {{ session ->
                      session.openWrite("RemoteConnect-update.apk", 0, file.length()).use {{ out ->
                        FileInputStream(file).use {{ input ->
                          input.copyTo(out)
                        }}
                        session.fsync(out)
                      }}
                      val callbackIntent = Intent(installAction).apply {{
                        setPackage(applicationContext.packageName)
                      }}
                      val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {{
                        PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_MUTABLE
                      }} else {{
                        PendingIntent.FLAG_UPDATE_CURRENT
                      }}
                      val pendingIntent = PendingIntent.getBroadcast(
                        this@MainActivity,
                        sessionId,
                        callbackIntent,
                        flags
                      )
                      session.commit(pendingIntent.intentSender)
                    }}
                  }} catch (e: Exception) {{
                    val safe = (e.message ?: "Error al iniciar PackageInstaller").replace("'", "")
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('$safe')")
                  }}
                }}
              }}
            }}

            private fun evalJs(script: String) {{
              runOnUiThread {{
                activeWebView?.evaluateJavascript(script, null)
              }}
            }}
          }}
          '''
          main_act.write_text(kotlin_code, encoding="utf-8")
          print("Patched AndroidManifest.xml and MainActivity.kt (PackageInstaller.Session) successfully")
          PYEOF

          npx tauri android build --apk --target aarch64

      - name: Sign APK with consistent release key
        shell: bash
        run: |
          mkdir -p android-assets
          APK_SRC=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_SRC"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 "$APK_SRC" /tmp/aligned.apk
          "$APKSIGNER" sign \
            --key .github/android-signing/release.pk8 \
            --cert .github/android-signing/release.x509.pem \
            --out android-assets/RemoteConnect-Android-arm64.apk /tmp/aligned.apk
          ls -lh android-assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Android-arm64
          path: android-assets/*

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          name: "RemoteConnect ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}"
          generate_release_notes: true
          files: all-assets/*
