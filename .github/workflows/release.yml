name: Build & Release Windows Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0). Leave empty to only upload build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build RemoteConnect Windows Portable & Installers (NSIS + MSI)
        working-directory: app
        run: npm run tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "app/src-tauri/target/release/remoteconnect-desktop.exe" "release-assets/RemoteConnect-Portable-x64.exe"
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/"
          Copy-Item "app/src-tauri/target/release/bundle/msi/*.msi" "release-assets/"
          Get-ChildItem release-assets

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Windows-x64
          path: release-assets/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          name: "RemoteConnect ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}"
          generate_release_notes: true
          files: release-assets/*
