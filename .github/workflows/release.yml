name: Build & Release Windows & Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.10). Leave empty to only upload build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.1.12" }
          (Get-Content app/src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$tag`"" | Set-Content app/src-tauri/Cargo.toml
          (Get-Content app/src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$tag`"" | Set-Content app/src-tauri/tauri.conf.json

      - name: Build RemoteConnect Windows Portable & Installers (NSIS + MSI)
        working-directory: app
        run: npm run tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "app/src-tauri/target/release/remoteconnect-desktop.exe" "release-assets/RemoteConnect-Portable-x64.exe"
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/"
          Copy-Item "app/src-tauri/target/release/bundle/msi/*.msi" "release-assets/"
          Get-ChildItem release-assets

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Windows-x64
          path: release-assets/*

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable + Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^version = \".*\"/version = \"$TAG\"/" app/src-tauri/Cargo.toml
            sed -i "s/\"version\": \".*\"/\"version\": \"$TAG\"/" app/src-tauri/tauri.conf.json
          fi

      - name: Initialize & Build Android APK (Tauri 2)
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64

      - name: Sign APK for direct installation
        shell: bash
        run: |
          mkdir -p android-assets
          APK_SRC=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_SRC"
          keytool -genkeypair -v -keystore /tmp/rc-release.keystore -alias remoteconnect \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass remoteconnect -keypass remoteconnect \
            -dname "CN=RemoteConnect, OU=App, O=RemoteConnect, L=Lima, S=Lima, C=PE"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 "$APK_SRC" /tmp/aligned.apk
          "$APKSIGNER" sign --ks /tmp/rc-release.keystore --ks-pass pass:remoteconnect \
            --key-pass pass:remoteconnect --out android-assets/RemoteConnect-Android-arm64.apk /tmp/aligned.apk
          ls -lh android-assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Android-arm64
          path: android-assets/*

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          name: "RemoteConnect ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}"
          generate_release_notes: true
          files: all-assets/*
