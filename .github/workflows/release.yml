name: Build & Release Windows & Android

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.10). Leave empty to only upload build artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_name }}" -match '^v(\d+\.\d+\.\d+)$') { $Matches[1] } else { "0.1.12" }
          (Get-Content app/src-tauri/Cargo.toml) -replace '^version = ".*"', "version = `"$tag`"" | Set-Content app/src-tauri/Cargo.toml
          (Get-Content app/src-tauri/tauri.conf.json) -replace '"version": ".*"', "`"version`": `"$tag`"" | Set-Content app/src-tauri/tauri.conf.json

      - name: Build RemoteConnect Windows Portable & Installers (NSIS + MSI)
        working-directory: app
        run: npm run tauri build

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item "app/src-tauri/target/release/remoteconnect-desktop.exe" "release-assets/RemoteConnect-Portable-x64.exe"
          Copy-Item "app/src-tauri/target/release/bundle/nsis/*.exe" "release-assets/"
          Copy-Item "app/src-tauri/target/release/bundle/msi/*.msi" "release-assets/"
          Get-ChildItem release-assets

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Windows-x64
          path: release-assets/*

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "app/package-lock.json"

      - name: Setup Rust stable + Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Sync version from Git tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^version = \".*\"/version = \"$TAG\"/" app/src-tauri/Cargo.toml
            sed -i "s/\"version\": \".*\"/\"version\": \"$TAG\"/" app/src-tauri/tauri.conf.json
          fi

      - name: Initialize & Build Android APK (Tauri 2)
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: |
          npx tauri android init --ci

          # Inject native Android in-app APK downloader & PackageInstaller bridge (window.AndroidUpdater)
          ANDROID_MAIN="src-tauri/gen/android/app/src/main"
          mkdir -p "$ANDROID_MAIN/res/xml"
          cat > "$ANDROID_MAIN/res/xml/update_file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <cache-path name="updates" path="." />
          </paths>
          EOF

          python3 - <<'PYEOF'
          from pathlib import Path
          manifest_path = Path("src-tauri/gen/android/app/src/main/AndroidManifest.xml")
          txt = manifest_path.read_text(encoding="utf-8")
          if "REQUEST_INSTALL_PACKAGES" not in txt:
              txt = txt.replace(
                  "<application",
                  '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n    <application',
                  1,
              )
          provider_xml = '''
                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.updateprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/update_file_paths" />
                  </provider>
              </application>'''
          if "updateprovider" not in txt:
              txt = txt.replace("</application>", provider_xml, 1)
          manifest_path.write_text(txt, encoding="utf-8")

          main_act = next(Path("src-tauri/gen/android/app/src/main/java").rglob("MainActivity.kt"))
          pkg_line = main_act.read_text(encoding="utf-8").splitlines()[0]
          kotlin_code = f'''{pkg_line}

          import android.content.Intent
          import android.webkit.JavascriptInterface
          import android.webkit.WebView
          import androidx.core.content.FileProvider
          import java.io.File
          import java.io.FileOutputStream
          import java.net.HttpURLConnection
          import java.net.URL
          import kotlin.concurrent.thread

          class MainActivity : TauriActivity() {{
            private var activeWebView: WebView? = null
            private var downloadedApk: File? = null

            override fun onWebViewCreate(webView: WebView) {{
              super.onWebViewCreate(webView)
              activeWebView = webView
              webView.addJavascriptInterface(AndroidUpdaterBridge(), "AndroidUpdater")
            }}

            inner class AndroidUpdaterBridge {{
              @JavascriptInterface
              fun downloadApk(urlStr: String) {{
                thread(start = true) {{
                  try {{
                    var currentUrl = urlStr
                    var conn: HttpURLConnection? = null
                    for (i in 0..5) {{
                      conn = (URL(currentUrl).openConnection() as HttpURLConnection).apply {{
                        instanceFollowRedirects = false
                        connectTimeout = 15000
                        readTimeout = 30000
                        setRequestProperty("User-Agent", "RemoteConnect-Android")
                      }}
                      val code = conn.responseCode
                      if (code in 300..399) {{
                        val loc = conn.getHeaderField("Location") ?: break
                        currentUrl = URL(URL(currentUrl), loc).toString()
                        conn.disconnect()
                      }} else {{
                        break
                      }}
                    }}
                    if (conn == null || conn.responseCode !in 200..299) {{
                      val status = conn?.responseCode ?: -1
                      evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('HTTP $status al descargar APK')")
                      return@thread
                    }}
                    val total = conn.contentLengthLong
                    val outFile = File(cacheDir, "RemoteConnect-update.apk")
                    conn.inputStream.use {{ input ->
                      FileOutputStream(outFile).use {{ output ->
                        val buf = ByteArray(16384)
                        var copied = 0L
                        var lastPct = -1
                        while (true) {{
                          val n = input.read(buf)
                          if (n <= 0) break
                          output.write(buf, 0, n)
                          copied += n
                          if (total > 0) {{
                            val pct = ((copied * 100) / total).toInt().coerceIn(0, 100)
                            if (pct != lastPct) {{
                              lastPct = pct
                              evalJs("window.__onAndroidUpdateProgress && window.__onAndroidUpdateProgress($pct)")
                            }}
                          }}
                        }}
                      }}
                    }}
                    conn.disconnect()
                    downloadedApk = outFile
                    evalJs("window.__onAndroidUpdateReady && window.__onAndroidUpdateReady()")
                  }} catch (e: Exception) {{
                    val safe = (e.message ?: "Error de red").replace("'", "")
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('$safe')")
                  }}
                }}
              }}

              @JavascriptInterface
              fun installApk() {{
                val file = downloadedApk ?: File(cacheDir, "RemoteConnect-update.apk")
                if (!file.exists()) {{
                  evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('Archivo APK no encontrado')")
                  return
                }}
                runOnUiThread {{
                  try {{
                    val uri = FileProvider.getUriForFile(
                      this@MainActivity,
                      "${{applicationContext.packageName}}.updateprovider",
                      file
                    )
                    val intent = Intent(Intent.ACTION_VIEW).apply {{
                      setDataAndType(uri, "application/vnd.android.package-archive")
                      addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION)
                      addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                    }}
                    startActivity(intent)
                  }} catch (e: Exception) {{
                    val safe = (e.message ?: "No se pudo abrir el instalador").replace("'", "")
                    evalJs("window.__onAndroidUpdateError && window.__onAndroidUpdateError('$safe')")
                  }}
                }}
              }}
            }}

            private fun evalJs(script: String) {{
              runOnUiThread {{
                activeWebView?.evaluateJavascript(script, null)
              }}
            }}
          }}
          '''
          main_act.write_text(kotlin_code, encoding="utf-8")
          print("Patched AndroidManifest.xml and MainActivity.kt successfully")
          PYEOF

          npx tauri android build --apk --target aarch64

      - name: Sign APK with consistent release key
        shell: bash
        run: |
          mkdir -p android-assets
          APK_SRC=$(find app/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK: $APK_SRC"
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          ZIPALIGN="${ANDROID_HOME}/build-tools/34.0.0/zipalign"
          "$ZIPALIGN" -f -p 4 "$APK_SRC" /tmp/aligned.apk
          "$APKSIGNER" sign \
            --key .github/android-signing/release.pk8 \
            --cert .github/android-signing/release.x509.pem \
            --out android-assets/RemoteConnect-Android-arm64.apk /tmp/aligned.apk
          ls -lh android-assets/

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RemoteConnect-Android-arm64
          path: android-assets/*

  publish-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}
          name: "RemoteConnect ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || github.event.inputs.tag }}"
          generate_release_notes: true
          files: all-assets/*
