[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/server",
    "crates/agent",
]
exclude = [
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["RemoteConnect"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
thiserror = "2.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
aes-gcm = "0.10"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
futures-util = "0.3"
chrono = { version = "0.4", features = ["serde"] }
