[package]
name = "remoteconnect-desktop"
version = "0.1.20"
description = "RemoteConnect Desktop App (Host + Viewer)"
authors = ["RemoteConnect"]
edition = "2021"

[lib]
name = "remoteconnect_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.44", features = ["full"] }
remoteconnect-protocol = { path = "../../crates/protocol" }
base64 = "0.22"
directories = "6.0"
hostname = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
remoteconnect-agent = { path = "../../crates/agent" }

[target.'cfg(windows)'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow"] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
